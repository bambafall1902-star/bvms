<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Chatbot Service Client</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chatbox {
      background: #fff;
      width: 100%;
      max-width: 400px;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .msg {
      margin-bottom: 8px;
    }
    .user {
      text-align: right;
      color: #0070f3;
    }
    .bot {
      text-align: left;
      color: #333;
    }
    input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-bottom: 5px;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #0070f3;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="chatbox">
    <div class="messages" id="messages">
      <div class="msg bot">👋 Bonjour ! Comment puis-je vous aider aujourd’hui ?</div>
    </div>

    <input id="msg" placeholder="Écris ton message..." />
    <button onclick="send()">Envoyer</button>
  </div>

  <script>
    async function send() {
      const input = document.getElementById("msg");
      const text = input.value.trim();
      if (!text) return;

      const messages = document.getElementById("messages");
      messages.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        messages.innerHTML += `<div class="msg bot">${data.reply}</div>`;
        messages.scrollTop = messages.scrollHeight;

      } catch {
        messages.innerHTML += `<div class="msg bot">❌ Erreur serveur</div>`;
      }
    }
  </script>
</body>
</html>
