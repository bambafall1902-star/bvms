<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chatbot IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chatbox {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .msg-user {
      text-align: right;
      margin-bottom: 8px;
      color: #000;
    }

    .msg-bot {
      text-align: left;
      margin-bottom: 8px;
      color: #333;
    }

    input {
      width: 75%;
      padding: 8px;
    }

    button {
      width: 22%;
      padding: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="chatbox">
  <h3>Chatbot IA</h3>

  <div class="messages" id="messages"></div>

  <input id="msg" placeholder="Écris un message..." />
  <button onclick="send()">Envoyer</button>
</div>

<script>
async function send() {
  const input = document.getElementById("msg");
  const messages = document.getElementById("messages");
  const text = input.value.trim();

  if (!text) return;

  // Affiche message utilisateur
  messages.innerHTML += `<div class="msg-user"><b>Vous :</b> ${text}</div>`;
  input.value = "";
  messages.scrollTop = messages.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    messages.innerHTML += `<div class="msg-bot"><b>Bot :</b> ${data.reply}</div>`;
    messages.scrollTop = messages.scrollHeight;

  } catch (e) {
    messages.innerHTML += `<div class="msg-bot"><b>Bot :</b> Erreur de connexion.</div>`;
  }
}
</script>

</body>
</html>
